[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macular"
version = "0.1.0"
description = "MACULAR: backbone-portable privacy-utility framework for multilingual medical document understanding, de-identification, and FHIR structuring"
readme = "README_COAUTHOR.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]        # weak floor engine
easyocr = ["easyocr>=1.7"]           # much stronger CJK; uses GPU if present
paddleocr = ["paddleocr>=2.7"]       # PP-OCR, strong CJK (also needs paddlepaddle)
pdf = ["reportlab>=4.0"]
# GPU / model core. Install on the (stronger) co-author machine.
# einops: PaddleOCR-VL's remote modeling code imports it at load time.
model = ["torch>=2.2", "transformers>=4.45", "accelerate>=0.30", "einops>=0.7"]
dev = ["pytest>=7.4"]

[project.scripts]
macular = "macular.runner:main"

[tool.setuptools.packages.find]
include = ["macular*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
