# Domain-adapt PaddleOCR-VL to medical forms and re-measure CER.
#
# The only experiment here that IMPROVES OCR rather than measuring it.
#
# Held out by GENERATOR FAMILY: train = family A, eval = family C, with disjoint
# name / address / organisation pools, phone prefixes and ID century digits. A
# CER drop therefore cannot be memorisation of the values.
#
# Cost: one generative forward per region for evaluation and one training step
# per region, so keep the budgets small until the first run reports.

data_dir: data/meddoc_cf_engines
device: cuda
dtype: bfloat16

train_epochs: 2
max_docs: 60          # training documents (family A)
eval_max_docs: 40     # evaluation documents (family C)
max_regions: 24
lr: 0.0001
lora_r: 8
lora_alpha: 16
seeds: [0, 1, 2]
use_rslora: true
result_suffix: "_rslora_r8"
