# Cross-corpus transfer, reverse direction: adapt on REAL XFUND scans,
# evaluate on SYNTHETIC rendered forms. Companion to ocr_adapt_syn2real.yaml;
# together they separate "adaptation learns the corpus" from "adaptation
# learns the task". The whole XFUND set (100 docs) trains; nothing is halved
# because the eval documents live in the other corpus.

data_dir: data/xfund                 # train: real scans (ja + es)
eval_data_dir: data/meddoc_cf_engines  # eval: synthetic (ko + ja + en)
device: cuda
dtype: bfloat16

train_epochs: 2
max_docs: 100
eval_max_docs: 40
max_regions: 24
lr: 0.0001
lora_r: 16
lora_alpha: 32
seeds: [0, 1, 2]
result_suffix: "_real2syn"
