# Reviewer response (round 2): per-method lr control for plain LoRA, so the
# rsLoRA-r8 recommendation is compared against LoRA at the lower rate too.
data_dir: data/xfund
device: cuda
dtype: bfloat16
train_epochs: 2
max_docs: 50
eval_max_docs: 50
max_regions: 24
lr: 0.00003
lora_r: 8
lora_alpha: 16
seeds: [0, 1, 2]
result_suffix: "_xfund_r8_lr3e5"
