# Config for the co-author machine (stronger GPU than the primary machine).
# Bump n_per_split and batch sizes as the GPU allows.

seed: 0
data_dir: data/meddoc
n_per_split: 500            # 500 x 3 splits = 1500 docs; raise for real runs
languages: [en, ko, ja]
counterfactual_layout: false   # set true to re-run the shortcut audit harder
render_images: true
# OCR baseline is region-level and per-language, with a swappable engine.
#   ocr_engine: tesseract  -> weak floor; needs language packs (kor/jpn/spa)
#   ocr_engine: easyocr    -> much better CJK; pip install -e ".[easyocr]"
# Tesseract is basically unusable for ko/ja — use easyocr to compare fairly.
ocr_engine: tesseract

# Model-core / GPU settings (used once macular/models is implemented).
device: cuda
dtype: bfloat16
backbone: Qwen/Qwen3-VL-8B-Instruct
train_batch_size: 8
grad_accum: 2
max_page_pixels: 1600000
