# Domain adaptation on REAL scanned forms (XFUND, Japanese + Spanish).
#
# The synthetic run showed CJK CER dropping (ko 0.121 -> 0.067, ja 0.104 ->
# 0.075) but on rendered text. This checks the same adaptation on genuine scans
# with genuine scanner noise.
#
# WEAKER HELD-OUT THAN THE SYNTHETIC RUN. XFUND ships one split, so train and
# eval are language-stratified halves of one document population rather than
# disjoint PII generator families. This answers "does adaptation help on real
# scans", NOT "does it generalise to unseen values" -- the synthetic run answers
# that one. The halving MUST stay stratified: test.jsonl is language-grouped, so
# a flat halving trains on ja and evaluates on es. See FINDINGS 4b.3.

data_dir: data/xfund
device: cuda
dtype: bfloat16

train_epochs: 2
max_docs: 50
eval_max_docs: 50
max_regions: 24
lr: 0.0001
lora_r: 16
lora_alpha: 32
seeds: [0, 3, 4, 5]  # seed 0 REPEATS the previous run: same code, same seed, same machine -- pure run-to-run reproducibility check. 3,4,5 test whether the tight 0.099 ja cluster was luck.
result_suffix: "_xfund_repro"
